<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <title>訂單寄信助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 設計變數(淺色 / 深色自動切換) ===== */
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e2e5ea;
      --text: #1a1c20;
      --text-2: #565c66;
      --text-3: #8a909a;
      --accent: #c8102e;
      --accent-hover: #a30d25;
      --accent-soft: #fdecef;
      --blue: #1d5bd8;
      --blue-soft: #e8effd;
      --amber: #a85d00;
      --amber-soft: #fdf2e0;
      --green: #157a3a;
      --green-soft: #e4f4ea;
      --red: #c21f1f;
      --red-soft: #fdeaea;
      --gray-soft: #eceef1;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
      --shadow-lg: 0 10px 30px rgba(16, 24, 40, .18);
      --radius: 16px;
      --radius-sm: 11px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101215;
        --surface: #1a1d21;
        --surface-2: #22262b;
        --border: #30353c;
        --text: #eceef1;
        --text-2: #aab0b9;
        --text-3: #7c838d;
        --accent: #e5384f;
        --accent-hover: #f0566b;
        --accent-soft: #3b1a20;
        --blue: #86aeff;
        --blue-soft: #1d2840;
        --amber: #f3b95f;
        --amber-soft: #382a14;
        --green: #6bd495;
        --green-soft: #183224;
        --red: #ff8585;
        --red-soft: #3c1c1c;
        --gray-soft: #2a2e34;
        --shadow: 0 0 0 1px rgba(255, 255, 255, .02);
        --shadow-lg: 0 10px 30px rgba(0, 0, 0, .55);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .ic {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: block;
    }

    .ic-sm {
      width: 16px;
      height: 16px;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ===== 登入 ===== */
    body.logged-out .needs-login {
      display: none !important;
    }

    body:not(.logged-out) #loginPanel {
      display: none;
    }

    .login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 32px 24px 24px;
    }

    .login-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .login-badge .ic {
      width: 28px;
      height: 28px;
    }

    .login-card h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--text-2);
      font-size: 15px;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      width: 100%;
      height: 52px;
      padding: 0 52px 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 17px;
      letter-spacing: .04em;
    }

    .pw-wrap input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .pw-toggle {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      background: none;
      color: var(--text-3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-error {
      color: var(--red);
      font-size: 14px;
      min-height: 22px;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    /* ===== 按鈕 ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 16px;
      transition: background .15s, border-color .15s, color .15s, transform .08s, opacity .15s;
      text-decoration: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .btn:disabled {
      cursor: default;
      opacity: .5;
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--green);
      color: var(--green);
    }

    .btn-secondary.is-done {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
      opacity: 1;
    }

    .btn-assign {
      background: var(--green);
      color: #fff;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 0;
      background: transparent;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--surface-2);
    }

    .icon-btn.spinning .ic {
      animation: spin .7s linear;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== 頂部列 ===== */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .appbar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 8px 6px 16px;
    }

    .appbar-text {
      flex: 1;
      min-width: 0;
    }

    .appbar-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .appbar-status {
      font-size: 13px;
      color: var(--text-3);
      min-height: 18px;
    }

    .toolbar {
      padding: 6px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--gray-soft);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .seg-btn {
      border: 0;
      background: transparent;
      border-radius: 9px;
      min-height: 40px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .count {
      font-size: 12px;
      font-weight: 700;
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 20px;
      background: var(--surface-2);
      color: var(--text-2);
    }

    .seg-btn.active .count {
      background: var(--accent);
      color: #fff;
    }

    .search {
      position: relative;
      display: block;
    }

    .search .ic {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
    }

    .search input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 16px;
    }

    .search input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }

    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--surface);
    }

    .chip .n {
      font-size: 12px;
      opacity: .8;
    }

    /* ===== 卡片 ===== */
    .list {
      padding: 12px 16px calc(110px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      --stripe: var(--blue);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: opacity .3s, transform .3s, max-height .35s, margin .35s, padding .35s;
      max-height: 2000px;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--stripe);
    }

    .card.is-overdue {
      --stripe: var(--amber);
    }

    .card.is-missing {
      --stripe: var(--red);
    }

    .card.is-unassigned {
      --stripe: var(--amber);
    }

    .card.is-done {
      opacity: .55;
    }

    .card.removing {
      opacity: 0;
      transform: scale(.97);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: -12px;
      border-width: 0;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
      word-break: break-word;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge.ok {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge.warn {
      background: var(--red-soft);
      color: var(--red);
    }

    .badge.late {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .card-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-3);
      font-size: 13px;
      margin-top: 4px;
    }

    .alert {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: var(--red-soft);
      color: var(--red);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    /* 信件詳細內容:預設收合 */
    details.mail {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 4px;
    }

    details.mail summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }

    details.mail summary::-webkit-details-marker {
      display: none;
    }

    details.mail summary .ic {
      transition: transform .2s;
    }

    details.mail[open] summary .ic {
      transform: rotate(180deg);
    }

    .field {
      margin-top: 10px;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-2);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      min-height: 32px;
    }

    .copy-btn.copied {
      background: var(--green-soft);
      color: var(--green);
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      resize: vertical;
    }

    .field textarea {
      min-height: 180px;
      line-height: 1.6;
    }

    .place {
      margin-top: 12px;
    }

    .place-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .place-btn .ic {
      color: var(--accent);
    }

    .place-btn .go {
      margin-left: auto;
      font-size: 13px;
      color: var(--blue);
      flex-shrink: 0;
    }

    .place-btn:disabled {
      color: var(--text-3);
      font-weight: 400;
      cursor: default;
    }

    .place-btn:disabled .ic {
      color: var(--text-3);
    }

    .select {
      width: 100%;
      height: 50px;
      padding: 0 40px 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a909a' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center / 18px;
      appearance: none;
      -webkit-appearance: none;
      font-size: 16px;
    }

    .select.placeholder {
      color: var(--text-3);
    }

    /* ===== 狀態畫面 ===== */
    .state {
      text-align: center;
      color: var(--text-2);
      padding: 56px 24px;
    }

    .state-icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .state-title {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .state-text {
      font-size: 14px;
    }

    .error-box {
      background: var(--red-soft);
      color: var(--red);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .error-box strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .error-box .btn {
      margin-top: 12px;
    }

    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .sk-line {
      height: 14px;
      border-radius: 6px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--gray-soft) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    /* ===== Toast(含撤銷倒數) ===== */
    #toast-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 520px;
      width: 100%;
      padding: 14px 12px 14px 16px;
      border-radius: 14px;
      background: #24272c;
      color: #fff;
      box-shadow: var(--shadow-lg);
      font-size: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: none;
    }

    .toast>.ic {
      color: #6bd495;
    }

    .toast .msg {
      flex: 1;
      min-width: 0;
    }

    .undo-btn {
      border: 0;
      background: rgba(255, 255, 255, .12);
      color: #9ec1ff;
      font-weight: 700;
      border-radius: 8px;
      min-height: 36px;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .toast-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: #9ec1ff;
      width: 100%;
      transform-origin: left;
      animation: countdown linear forwards;
    }

    @keyframes countdown {
      to {
        transform: scaleX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="logged-out">
  <!-- 登入畫面 -->
  <main id="loginPanel" class="login">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-badge" data-icon="lock"></div>
      <h1>訂單寄信助手</h1>
      <p>此頁僅限訂單處理人員使用，請輸入管理員密碼。登入後這支手機會記住。</p>
      <div class="pw-wrap">
        <input type="password" id="pwInput" autocomplete="current-password" autocapitalize="off" autocorrect="off"
          spellcheck="false" placeholder="管理員密碼" aria-label="管理員密碼">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="顯示密碼" data-icon="eye"></button>
      </div>
      <div class="login-error" id="loginError" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登入</button>
    </form>
  </main>

  <!-- 登入後 -->
  <div class="page needs-login">
    <header class="appbar">
      <div class="appbar-row">
        <div class="appbar-text">
          <div class="appbar-title" id="pageTitle">待寄送訂單</div>
          <div class="appbar-status" id="status"></div>
        </div>
        <button class="icon-btn" id="refreshBtn" aria-label="重新整理" title="重新整理" data-icon="refresh"></button>
        <button class="icon-btn" id="logoutBtn" aria-label="登出" title="登出" data-icon="logout"></button>
      </div>

      <div class="toolbar">
        <div class="segmented" id="tabRow" role="tablist">
          <button class="seg-btn active" data-tab="pending" role="tab">待寄送 <span class="count" id="pendingTabCount">0</span></button>
          <button class="seg-btn" data-tab="unassigned" role="tab">待分配門市 <span class="count" id="unassignedTabCount">0</span></button>
        </div>

        <div id="pendingControls" class="toolbar" style="padding:0;">
          <label class="search">
            <span data-icon="search"></span>
            <input type="search" id="searchInput" placeholder="搜尋門市名稱" aria-label="搜尋門市名稱">
          </label>
          <div class="chips" id="chipRow">
            <button class="chip active" data-filter="all">全部 <span class="n" id="chipAll"></span></button>
            <button class="chip" data-filter="missing">需確認 <span class="n" id="chipMissing"></span></button>
            <button class="chip" data-filter="overdue">逾期 24 小時 <span class="n" id="chipOverdue"></span></button>
          </div>
        </div>
      </div>
    </header>

    <main class="list" id="list"></main>
    <main class="list" id="unassignedList" hidden></main>
  </div>

  <div id="toast-wrap" aria-live="polite"></div>

  <script>
    // ⚠ 請把這裡換成你部署的 Apps Script API 網址(結尾是 /exec)
    const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbwBK4B7s-podG59uymZWGSvPp6xJA-wZT3An_CB9eibBsp-6fcTf-qaTDJh6LrRykfoIA/exec';

    // 統一呼叫後端 API 的小工具,取代原本的 google.script.run。
    // 一律用 POST + text/plain 帶 JSON 字串(含登入密碼),密碼不會出現在網址裡
    // (故意用 text/plain 而不是 application/json,是為了避免瀏覽器送出
    //  CORS 的 preflight(OPTIONS)請求,Apps Script 不會處理 preflight,用
    //  text/plain 送才能順利送到後端)
    // 回傳一個 Promise,resolve 時給的就是後端函式原本回傳的那個物件(含 success 欄位);
    // 密碼錯誤/失效時直接跳回登入畫面,並回傳永遠不會完成的 Promise,讓呼叫端不會再蓋掉畫面
    function gasCall(action, params) {
      const body = Object.assign({ action: action, pw: password }, params || {});
      return fetch(API_BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(parseApiResponse_, explainFetchError_).then(function (res) {
        if (res && res.authError) {
          showLogin('密碼錯誤或已失效，請重新輸入');
          return new Promise(function () { });
        }
        return res;
      });
    }

    // 後端回的不是 JSON(例如網址指到舊的 HTML 部署、或 Google 授權/錯誤頁)時給出看得懂的錯誤
    function parseApiResponse_(r) {
      return r.text().then(function (text) {
        try { return JSON.parse(text); } catch (e) {
          throw new Error('API 回傳的不是 JSON(可能 API_BASE_URL 指到的不是 apps-script-api 的部署,或尚未授權)。開頭內容:' + text.slice(0, 120));
        }
      });
    }

    // 跨網域時瀏覽器只會給 "Failed to fetch",補上最常見的原因
    function explainFetchError_(err) {
      throw new Error(err.message + '\n可能原因:① 網路中斷;② API_BASE_URL 不是 apps-script-api 的 /exec 網址;③ 頁面放在禁止對外連線的環境(例如 Claude Artifact)。');
    }

    // ===== 圖示(靜態 SVG,只用在固定字串,不放使用者資料) =====
    const ICONS = {
      lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
      eyeOff: '<path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
      mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
      check: '<path d="M20 6L9 17l-5-5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      alert: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
      chevron: '<path d="M6 9l6 6 6-6"/>',
      copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
      pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
      store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>'
    };

    function svg(name, extraClass) {
      return '<svg class="ic' + (extraClass ? ' ' + extraClass : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
    }

    function iconEl(name, extraClass) {
      const span = document.createElement('span');
      span.innerHTML = svg(name, extraClass);
      return span.firstChild;
    }

    document.querySelectorAll('[data-icon]').forEach(function (node) {
      node.innerHTML = svg(node.dataset.icon);
    });

    // 建立元素的小工具:文字一律用 textContent,不會被當成 HTML 解析
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    const $ = function (id) { return document.getElementById(id); };

    // ===== 常數與狀態 =====
    // 逾時未寄送門檻(毫秒):超過此時數視為逾期
    const OVERDUE_HOURS = 24;
    const OVERDUE_MS = OVERDUE_HOURS * 60 * 60 * 1000;
    // mailto 內容過長時瀏覽器/郵件用戶端可能截斷,超過此字元數就提醒改用複製
    const MAILTO_SAFE_LENGTH = 1800;
    // 沒有值時 safeVal_ 在後端會回傳這個字,顯示地址時要跳過,不然會冒出一顆
    // 指向「顧客未提供」的地圖按鈕
    const NO_VALUE_TEXT = '顧客未提供';
    const PW_STORAGE_KEY = 'mobile_sidebar_pw';
    const UNDO_MS = 5000;

    let allOrders = [];
    let unassignedOrders = [];
    let storeNameOptions = [];
    let loadingTimeout;
    let unassignedLoadingTimeout;
    let currentFilter = 'all'; // 'all' | 'missing' | 'overdue'
    let currentTab = 'pending'; // 'pending' | 'unassigned'
    let password = '';

    function setStatus(msg) {
      $('status').textContent = msg;
    }

    function nowTime() {
      return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(ms) {
      if (typeof ms !== 'number') return '';
      const min = Math.floor((Date.now() - ms) / 60000);
      if (min < 1) return '剛剛';
      if (min < 60) return min + ' 分鐘前';
      const h = Math.floor(min / 60);
      if (h < 24) return h + ' 小時前';
      return Math.floor(h / 24) + ' 天前';
    }

    // ===== 登入 / 登出:此頁只接受管理員密碼(AC 密碼會被擋下) =====
    $('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const pw = $('pwInput').value.trim();
      if (!pw) {
        $('loginError').textContent = '請輸入密碼';
        return;
      }
      login(pw);
    });

    $('pwToggle').addEventListener('click', function () {
      const input = $('pwInput');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      this.innerHTML = svg(show ? 'eyeOff' : 'eye');
      this.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
    });

    $('logoutBtn').addEventListener('click', function () {
      if (!confirm('確定要登出嗎？下次需要重新輸入密碼。')) return;
      showLogin('');
    });

    function login(pw) {
      password = pw;
      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = '驗證中…';
      $('loginError').textContent = '';

      gasCall('login').then(function (res) {
        btn.disabled = false;
        btn.textContent = '登入';
        if (!res || !res.success) {
          $('loginError').textContent = res ? res.error : '後端回傳空值';
          return;
        }
        if (res.role !== 'admin') {
          password = '';
          $('loginError').textContent = '這是 AC 密碼，此頁需要管理員密碼';
          return;
        }
        try { localStorage.setItem(PW_STORAGE_KEY, pw); } catch (e) { /* 存不進去就算了,下次再輸入一次 */ }
        $('pwInput').value = '';
        document.body.classList.remove('logged-out');
        load();
        loadUnassigned();
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = '登入';
        $('loginError').textContent = err.message;
      });
    }

    function showLogin(message) {
      password = '';
      try { localStorage.removeItem(PW_STORAGE_KEY); } catch (e) { }
      clearTimeout(loadingTimeout);
      clearTimeout(unassignedLoadingTimeout);
      setStatus('');
      document.body.classList.add('logged-out');
      const btn = $('loginBtn');
      btn.disabled = false;
      btn.textContent = '登入';
      $('loginError').textContent = message || '';
    }

    // ===== 頂部操作 =====
    $('refreshBtn').addEventListener('click', function () {
      const btn = this;
      btn.classList.add('spinning');
      setTimeout(function () { btn.classList.remove('spinning'); }, 700);
      load();
      loadUnassigned();
    });

    $('searchInput').addEventListener('input', applyFilters);

    $('chipRow').addEventListener('click', function (e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
      currentFilter = chip.dataset.filter;
      applyFilters();
    });

    $('tabRow').addEventListener('click', function (e) {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      switchTab(btn.dataset.tab);
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.seg-btn').forEach(function (b) {
        const on = b.dataset.tab === tab;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const isPending = tab === 'pending';
      $('pageTitle').textContent = isPending ? '待寄送訂單' : '待分配門市';
      $('pendingControls').hidden = !isPending;
      $('list').hidden = !isPending;
      $('unassignedList').hidden = isPending;
      window.scrollTo(0, 0);
    }

    function setPendingTabCount(n) {
      $('pendingTabCount').textContent = n;
    }

    function setUnassignedTabCount(n) {
      $('unassignedTabCount').textContent = n;
    }

    // ===== 共用畫面狀態 =====
    function showState(listId, icon, title, text) {
      const list = $(listId);
      list.innerHTML = '';
      const box = el('div', 'state');
      box.appendChild(el('div', 'state-icon', icon));
      box.appendChild(el('div', 'state-title', title));
      if (text) box.appendChild(el('div', 'state-text', text));
      list.appendChild(box);
    }

    function showSkeleton(listId) {
      const list = $(listId);
      list.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const sk = el('div', 'skeleton');
        [45, 30, 100, 100].forEach(function (w, j) {
          const line = el('div', 'sk-line');
          line.style.width = w + '%';
          if (j >= 2) line.style.height = '40px';
          sk.appendChild(line);
        });
        list.appendChild(sk);
      }
    }

    function showError(listId, message, retry) {
      const list = $(listId);
      list.innerHTML = '';
      const box = el('div', 'error-box');
      box.setAttribute('role', 'alert');
      box.appendChild(el('strong', null, '發生錯誤'));
      box.appendChild(document.createTextNode(message));
      if (retry) {
        const btn = el('button', 'btn btn-secondary', '重試');
        btn.addEventListener('click', retry);
        box.appendChild(el('br'));
        box.appendChild(btn);
      }
      list.appendChild(box);
    }

    // 標記完成當下就把該筆從「待處理」計數中移除(不等卡片淡出動畫跑完)
    function removeOrderFromState(order) {
      const idx = allOrders.indexOf(order);
      if (idx !== -1) allOrders.splice(idx, 1);
      setPendingTabCount(allOrders.length);
      updateChipCounts();
    }

    // 撤銷時把該筆加回待處理計數
    function restoreOrderToState(order) {
      if (allOrders.indexOf(order) === -1) {
        allOrders.push(order);
        allOrders = sortOrders(allOrders);
      }
      setPendingTabCount(allOrders.length);
      updateChipCounts();
    }

    function isOverdue(order) {
      return typeof order.submitTimeKey === 'number' &&
        (Date.now() - order.submitTimeKey) > OVERDUE_MS;
    }

    function sortOrders(orders) {
      // 依填寫時間由舊到新排序,舊訂單優先處理;無法解析時間的排最後
      return orders.slice().sort(function (a, b) {
        const ta = typeof a.submitTimeKey === 'number' ? a.submitTimeKey : Infinity;
        const tb = typeof b.submitTimeKey === 'number' ? b.submitTimeKey : Infinity;
        return ta - tb;
      });
    }

    function updateChipCounts() {
      $('chipAll').textContent = allOrders.length;
      $('chipMissing').textContent = allOrders.filter(function (o) { return o.missingInfo; }).length;
      $('chipOverdue').textContent = allOrders.filter(isOverdue).length;
    }

    // 結合「搜尋文字」跟「篩選標籤(全部/需確認/逾期)」兩個條件,一起套用後重新渲染
    function applyFilters() {
      const keyword = $('searchInput').value.trim().toLowerCase();
      let result = allOrders;

      if (currentFilter === 'missing') {
        result = result.filter(function (o) { return o.missingInfo; });
      } else if (currentFilter === 'overdue') {
        result = result.filter(isOverdue);
      }

      if (keyword) {
        result = result.filter(function (o) { return (o.storeName || '').toLowerCase().indexOf(keyword) !== -1; });
      }

      updateChipCounts();
      renderList(result, !!keyword || currentFilter !== 'all');
    }

    // ===== 待寄送訂單 =====
    function load() {
      setStatus('載入中…');
      showSkeleton('list');
      clearTimeout(loadingTimeout);
      loadingTimeout = setTimeout(function () {
        setStatus('已等待超過 10 秒，仍在等待回應…');
      }, 10000);

      gasCall('getPendingOrders').then(onLoaded).catch(onError);
    }

    function onLoaded(result) {
      clearTimeout(loadingTimeout);
      if (!result || !result.success) {
        onError({ message: result ? result.error : '後端回傳空值' });
        return;
      }
      setStatus('更新於 ' + nowTime());
      allOrders = sortOrders(result.orders || []);
      setPendingTabCount(allOrders.length);
      applyFilters();
    }

    function onError(err) {
      clearTimeout(loadingTimeout);
      setStatus('載入失敗');
      setPendingTabCount(0);
      showError('list', err && err.message ? err.message : JSON.stringify(err), load);
    }

    function makeField(labelText, value, multiline) {
      const wrap = el('div', 'field');
      const head = el('div', 'field-head');
      head.appendChild(el('span', 'field-label', labelText));

      const field = document.createElement(multiline ? 'textarea' : 'input');
      if (!multiline) field.type = 'text';
      field.readOnly = true;
      field.value = value;
      field.setAttribute('aria-label', labelText);

      const btn = el('button', 'copy-btn');
      btn.type = 'button';
      setCopyLabel(btn, false);
      btn.addEventListener('click', function () { copyField(field, btn); });
      head.appendChild(btn);

      wrap.appendChild(head);
      wrap.appendChild(field);
      return wrap;
    }

    function setCopyLabel(btn, copied) {
      btn.innerHTML = svg(copied ? 'check' : 'copy', 'ic-sm');
      btn.appendChild(document.createTextNode(copied ? '已複製' : '複製'));
      btn.classList.toggle('copied', copied);
    }

    // 優先使用現代 Clipboard API,不支援時(例如非 https 環境)退回 execCommand
    function copyField(field, btn) {
      const finish = function (ok) {
        if (ok) {
          setCopyLabel(btn, true);
        } else {
          btn.textContent = '複製失敗';
        }
        setTimeout(function () { setCopyLabel(btn, false); }, 1300);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(field.value).then(
          function () { finish(true); },
          function () { finish(legacyCopy_(field)); }
        );
      } else {
        finish(legacyCopy_(field));
      }
    }

    function legacyCopy_(field) {
      try {
        field.select();
        field.setSelectionRange(0, 999999);
        return document.execCommand('copy');
      } catch (e) {
        return false;
      }
    }

    // 用暫時建立的 <a> 標籤觸發外部 App(郵件 / 地圖),在手機瀏覽器裡比 window.open 穩定
    function openExternal(url) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_top';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 用 mailto 連結呼叫預設郵件軟體(Outlook)並帶入 To/CC/主旨/內文
    // 使用者仍需在 Outlook 內自行按下傳送,不會自動寄出
    function openInOutlook(order) {
      const to = order.to || '';
      const params = 'cc=' + encodeURIComponent(order.cc || '') +
        '&subject=' + encodeURIComponent(order.subject || '') +
        '&body=' + encodeURIComponent(order.body || '');
      const mailto = 'mailto:' + encodeURIComponent(to) + '?' + params;

      if (mailto.length > MAILTO_SAFE_LENGTH) {
        const proceed = confirm(
          '這封信內容較長，用「開啟 Outlook」自動帶入時，部分郵件軟體可能會截斷內文。\n\n' +
          '仍要嘗試開啟嗎？(建議展開「信件內容」用「複製」按鈕，貼到 Outlook 較保險)'
        );
        if (!proceed) return;
      }
      openExternal(mailto);
    }

    function renderList(orders, filtered) {
      const list = $('list');
      list.innerHTML = '';

      if (!orders || orders.length === 0) {
        if (filtered) {
          showState('list', '🔍', '沒有符合條件的訂單', '換個關鍵字或篩選條件試試');
        } else {
          showState('list', '🎉', '目前沒有待寄送的訂單', '全部處理完了！');
        }
        return;
      }

      orders.forEach(function (o) { list.appendChild(buildPendingCard(o)); });
    }

    function buildPendingCard(o) {
      const overdue = isOverdue(o);
      const card = el('article', 'card' + (o.missingInfo ? ' is-missing' : (overdue ? ' is-overdue' : '')));
      card.id = 'card-' + o.rowIndex;

      const head = el('div', 'card-head');
      head.appendChild(el('h3', 'card-title', o.storeName));
      const badges = el('div', 'badges');
      if (overdue) badges.appendChild(el('span', 'badge late', '逾期'));
      badges.appendChild(el('span', 'badge ' + (o.missingInfo ? 'warn' : 'ok'), o.missingInfo ? '需確認' : '資料完整'));
      head.appendChild(badges);
      card.appendChild(head);

      const sub = el('div', 'card-sub');
      sub.appendChild(iconEl('clock', 'ic-sm'));
      const ago = timeAgo(o.submitTimeKey);
      sub.appendChild(document.createTextNode('填寫於 ' + (o.submitTimeDisplay || '未知') + (ago ? '・' + ago : '')));
      card.appendChild(sub);

      if (o.missingInfo) {
        const warn = el('div', 'alert');
        warn.appendChild(iconEl('alert', 'ic-sm'));
        warn.appendChild(el('span', null, '找不到完整門市對應資料，請人工確認收件人信箱'));
        card.appendChild(warn);
      }

      const actions = el('div', 'actions');
      // 主要動作:開啟 Outlook 寄信
      const outlookBtn = el('button', 'btn btn-primary btn-block');
      outlookBtn.appendChild(iconEl('mail'));
      outlookBtn.appendChild(document.createTextNode('在 Outlook 開啟'));
      outlookBtn.addEventListener('click', function () { openInOutlook(o); });
      actions.appendChild(outlookBtn);

      // 次要動作:確認已寄送
      const doneBtn = el('button', 'btn btn-secondary btn-block');
      setDoneLabel(doneBtn, 'idle');
      doneBtn.addEventListener('click', function () { markDone(o, doneBtn, outlookBtn, card); });
      actions.appendChild(doneBtn);
      card.appendChild(actions);

      // 信件詳細內容(收件人/副本/主旨/內文)預設收合,需要時再展開查看或複製
      const details = el('details', 'mail');
      const summary = el('summary');
      summary.appendChild(el('span', null, '信件內容（收件人、副本、主旨、內文）'));
      summary.appendChild(iconEl('chevron'));
      details.appendChild(summary);
      details.appendChild(makeField('收件人 To', o.to || '', false));
      details.appendChild(makeField('副本 CC', o.cc || '', false));
      details.appendChild(makeField('主旨', o.subject || '', false));
      details.appendChild(makeField('內文', o.body || '', true));
      card.appendChild(details);

      return card;
    }

    function setDoneLabel(btn, state) {
      btn.classList.toggle('is-done', state === 'done');
      if (state === 'busy') {
        btn.textContent = '處理中…';
        return;
      }
      btn.innerHTML = svg('check');
      btn.appendChild(document.createTextNode(state === 'done' ? '已標記完成' : '已寄送，標記完成'));
    }

    function removeCard(card, listId, emptyFn) {
      card.classList.add('removing');
      setTimeout(function () {
        card.remove();
        if ($(listId).children.length === 0) emptyFn();
      }, 380);
    }

    // 顯示可撤銷的 toast(底部有倒數條);倒數結束或使用者未動作時才真正把卡片移除
    function showUndoToast(message, onUndo, onExpire, durationMs) {
      const wrap = $('toast-wrap');
      const toast = el('div', 'toast');
      toast.appendChild(iconEl('check'));
      toast.appendChild(el('span', 'msg', message));
      const undoBtn = el('button', 'undo-btn', '撤銷');
      toast.appendChild(undoBtn);
      const bar = el('div', 'toast-bar');
      bar.style.animationDuration = durationMs + 'ms';
      toast.appendChild(bar);

      wrap.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });

      let done = false;
      const timer = setTimeout(function () {
        if (done) return;
        done = true;
        dismiss();
        onExpire();
      }, durationMs);

      function dismiss() {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 250);
      }

      undoBtn.addEventListener('click', function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        dismiss();
        onUndo();
      });
    }

    function showToast(message) {
      const wrap = $('toast-wrap');
      const toast = el('div', 'toast');
      toast.appendChild(iconEl('check'));
      toast.appendChild(el('span', 'msg', message));
      wrap.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 250);
      }, 3000);
    }

    function markDone(order, btn, outlookBtn, card) {
      btn.disabled = true;
      outlookBtn.disabled = true;
      setDoneLabel(btn, 'busy');

      function resetButtons() {
        btn.disabled = false;
        outlookBtn.disabled = false;
        card.classList.remove('is-done');
        setDoneLabel(btn, 'idle');
      }

      gasCall('markAsSent', { submitTimeKey: order.submitTimeKey })
        .then(function (res) {
          if (!res || !res.success) {
            alert('標記失敗: ' + (res ? res.error : '未知錯誤'));
            resetButtons();
            return;
          }
          setDoneLabel(btn, 'done');
          card.classList.add('is-done');
          removeOrderFromState(order);

          if (res.matchCount > 1) {
            alert('注意:填寫時間有 ' + res.matchCount + ' 筆重複，已標記第一筆符合的資料，建議人工確認 worksheet 是否正確');
          }

          // 給 5 秒的撤銷時間,期間卡片先留在畫面上(變淡)
          showUndoToast(
            order.storeName + ' 已標記完成',
            function onUndo() {
              setDoneLabel(btn, 'busy');
              gasCall('unmarkAsSent', { submitTimeKey: order.submitTimeKey })
                .then(function (r) {
                  if (r && r.success) {
                    resetButtons();
                    restoreOrderToState(order);
                    showToast('已撤銷「' + order.storeName + '」');
                  } else {
                    alert('撤銷失敗: ' + (r ? r.error : '未知錯誤') + '\n請按右上角重新整理確認狀態');
                    resetButtons();
                    restoreOrderToState(order);
                  }
                })
                .catch(function (err) {
                  alert('撤銷失敗: ' + err.message + '\n請按右上角重新整理確認狀態');
                  resetButtons();
                  restoreOrderToState(order);
                });
            },
            function onExpire() {
              removeCard(card, 'list', function () { applyFilters(); });
            },
            UNDO_MS
          );
        })
        .catch(function (err) {
          alert('標記失敗: ' + err.message);
          resetButtons();
        });
    }

    // ===== 待分配門市 =====
    function loadUnassigned() {
      showSkeleton('unassignedList');
      clearTimeout(unassignedLoadingTimeout);
      unassignedLoadingTimeout = setTimeout(function () {
        if (currentTab === 'unassigned') setStatus('已等待超過 10 秒，仍在等待回應…');
      }, 10000);

      gasCall('getUnassignedOrders').then(onUnassignedLoaded).catch(onUnassignedError);
    }

    function onUnassignedLoaded(result) {
      clearTimeout(unassignedLoadingTimeout);
      if (!result || !result.success) {
        onUnassignedError({ message: result ? result.error : '後端回傳空值' });
        return;
      }
      if (currentTab === 'unassigned') setStatus('更新於 ' + nowTime());
      unassignedOrders = sortOrders(result.orders || []);
      storeNameOptions = result.storeNames || [];
      setUnassignedTabCount(unassignedOrders.length);
      renderUnassignedList(unassignedOrders);
    }

    function onUnassignedError(err) {
      clearTimeout(unassignedLoadingTimeout);
      setUnassignedTabCount(0);
      showError('unassignedList', err && err.message ? err.message : JSON.stringify(err), loadUnassigned);
    }

    function openInMaps(query) {
      if (!query || query === NO_VALUE_TEXT) return;
      openExternal('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query));
    }

    function makePlace(labelText, value) {
      const wrap = el('div', 'place');
      wrap.appendChild(el('div', 'field-label', labelText));
      const hasValue = value && value !== NO_VALUE_TEXT;
      const btn = el('button', 'place-btn');
      btn.type = 'button';
      btn.style.marginTop = '4px';
      btn.appendChild(iconEl('pin'));
      btn.appendChild(el('span', null, hasValue ? value : NO_VALUE_TEXT));
      if (hasValue) {
        btn.appendChild(el('span', 'go', '地圖 ›'));
        btn.addEventListener('click', function () { openInMaps(value); });
      } else {
        btn.disabled = true;
      }
      wrap.appendChild(btn);
      return wrap;
    }

    function emptyUnassigned() {
      showState('unassignedList', '🎉', '目前沒有待分配門市的訂單', '有新的待分配訂單時會出現在這裡');
    }

    function renderUnassignedList(orders) {
      const list = $('unassignedList');
      list.innerHTML = '';
      if (!orders || orders.length === 0) {
        emptyUnassigned();
        return;
      }
      orders.forEach(function (o) { list.appendChild(buildUnassignedCard(o)); });
    }

    function buildUnassignedCard(o) {
      const card = el('article', 'card is-unassigned');
      card.id = 'unassigned-' + o.rowIndex;

      const head = el('div', 'card-head');
      head.appendChild(el('h3', 'card-title', o.customer && o.customer !== NO_VALUE_TEXT ? o.customer : ('第 ' + o.rowIndex + ' 列')));
      const badges = el('div', 'badges');
      badges.appendChild(el('span', 'badge late', '待分配'));
      head.appendChild(badges);
      card.appendChild(head);

      const sub = el('div', 'card-sub');
      sub.appendChild(iconEl('clock', 'ic-sm'));
      const ago = timeAgo(o.submitTimeKey);
      sub.appendChild(document.createTextNode('填寫於 ' + (o.submitTimeDisplay || '未知') + (ago ? '・' + ago : '')));
      card.appendChild(sub);

      card.appendChild(makePlace('鄰近必勝客門市（參考用）', o.nearbyStore));
      card.appendChild(makePlace('外送地址', o.deliveryAddress));

      // 指派門市
      const field = el('div', 'place');
      const selectId = 'assign-' + o.rowIndex;
      const label = el('label', 'field-label', '指派門市');
      label.htmlFor = selectId;
      field.appendChild(label);
      const select = el('select', 'select placeholder');
      select.id = selectId;
      select.style.marginTop = '4px';
      const placeholder = el('option', null, '請選擇門市…');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);
      storeNameOptions.forEach(function (name) {
        const opt = el('option', null, name);
        opt.value = name;
        select.appendChild(opt);
      });
      field.appendChild(select);
      card.appendChild(field);

      const actions = el('div', 'actions');
      const confirmBtn = el('button', 'btn btn-assign btn-block');
      confirmBtn.disabled = true;
      setAssignLabel(confirmBtn, '');
      actions.appendChild(confirmBtn);
      card.appendChild(actions);

      select.addEventListener('change', function () {
        select.classList.toggle('placeholder', !select.value);
        confirmBtn.disabled = !select.value;
        setAssignLabel(confirmBtn, select.value);
      });
      confirmBtn.addEventListener('click', function () {
        confirmAssign(o, select, confirmBtn, card);
      });

      return card;
    }

    function setAssignLabel(btn, storeName) {
      btn.innerHTML = svg('store');
      btn.appendChild(document.createTextNode(storeName ? '指派給「' + storeName + '」' : '請先選擇門市'));
    }

    function confirmAssign(order, select, btn, card) {
      const storeName = select.value;
      if (!storeName) {
        alert('請先選擇門市，再按確認指派');
        return;
      }

      btn.disabled = true;
      btn.textContent = '處理中…';
      select.disabled = true;

      function reset() {
        btn.disabled = false;
        select.disabled = false;
        setAssignLabel(btn, select.value);
      }

      gasCall('assignStore', { submitTimeKey: order.submitTimeKey, storeName: storeName })
        .then(function (res) {
          if (!res || !res.success) {
            alert('指派失敗: ' + (res ? res.error : '未知錯誤'));
            reset();
            return;
          }
          if (res.matchCount > 1) {
            alert('注意:填寫時間有 ' + res.matchCount + ' 筆重複，已指派第一筆符合的資料，建議人工確認 worksheet 是否正確');
          }
          const idx = unassignedOrders.indexOf(order);
          if (idx !== -1) unassignedOrders.splice(idx, 1);
          setUnassignedTabCount(unassignedOrders.length);

          showToast('已指派「' + res.storeName + '」，待寄送訂單同步更新中');
          removeCard(card, 'unassignedList', emptyUnassigned);
          // 指派完成後自動重整「待寄送訂單」,不用手動按重整才會看到剛指派好的這筆
          load();
        })
        .catch(function (err) {
          alert('指派失敗: ' + err.message);
          reset();
        });
    }

    let savedPw = '';
    try { savedPw = localStorage.getItem(PW_STORAGE_KEY) || ''; } catch (e) { /* 讀不到就當作沒有 */ }
    if (savedPw) login(savedPw);
  </script>
</body>

</html>
